<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Terminus</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Handjet:wght@400;600&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; height: 100%; background: #120e18; overflow: hidden; }
      #game { width: 100%; height: 100%; }
      canvas { image-rendering: pixelated; }
      @font-face { font-family: "Dogica"; src: url("/fonts/dogica.otf") format("opentype"); }
      /* Force le chargement de la police avant Phaser */
      .font-warmup { font-family: "DotGothic16"; position: absolute; left: -999px; }
    </style>
  </head>
  <body>
    <span class="font-warmup">.</span><span class="font-warmup" style="font-family:Handjet">.</span><span class="font-warmup" style="font-family:Dogica">.</span>
    <div id="game"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
